# GitHub Pages site (utf13-reports.ucaiug.io), built from docs/.
# Primer is the theme GitHub Pages uses when none is named; it is named here
# so that assets/css/style.scss can build on it.
theme: jekyll-theme-primer
title: UCA TF13 CIM Grid Package Releases
tagline: Published and interim CIM Grid package releases
description: >-
  Published and interim releases of the CIM Grid package from UCA TF13,
  with release notes and comparison reports.

# Primer prints the site title above a page whose title differs from it.
# index.md's first heading is the logo (HTML), which Pages does not read as a
# title, so give the page its title here.
defaults:
  # Link-preview (Open Graph / X card) image for every page, emitted by {% seo %}
  # in the layout. jekyll-seo-tag only reads a page-level image, so it is set
  # here as a front-matter default. The same PNG is the repo's Social preview.
  - scope:
      path: ""
    values:
      image:
        path: /media/logo/tf13-reports-social-1280x640.png
        width: 1280
        height: 640
        alt: "UCA TF13 CIM Releases"
  - scope:
      path: "index.md"
    values:
      title: UCA TF13 CIM Grid Package Releases

# Header buttons (index.md). Update with each new interim release or IEC edition.
tf13_interim_release: CIM18v16
tf13_interim_url: https://ucatf.org/tf13/?wpcp_
tf13_interim_notes: /18v15-18v16/CIM18v16_ReleaseNotes.pdf
tf13_is_edition: Ed 7.1
tf13_is_release: CIM17v40
tf13_is_url: "https://cimug.org/cimdocs/standards-artifacts/?wpcp_"
